name: Build Electron Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: |
          npx electron-builder --publish=never $TARGETS
        env:
          # Build targets per OS (override via env var for clarity)
          # Windows: build NSIS installer. macOS: build ARM64 only with ZIP (smaller)
          TARGETS: ${{ matrix.os == 'windows-latest' && '--win' || '--mac=zip --arm64' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
          if-no-files-found: warn


